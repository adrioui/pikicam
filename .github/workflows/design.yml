name: Design

# The design rules are enforced, not documented. This workflow exists because
# the design layer once sat outside every Xcode target for ~2 months: it never
# compiled, the lint never ran, and `xcodebuild test` still printed
# TEST SUCCEEDED having executed zero tests. Never again.
#
# NOTE: this workflow is expected to be RED until the app is wired to the
# design system. As of 2026-10-02 the lint runs 26 tests and reports 63
# distinct violations across the camera and gallery. That is the honest state
# of the code, and it is the point — the rules now fail loudly instead of
# passing quietly.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  design-lint:
    # Requires an Xcode with the iOS 26.x SDK (the deployment target is 26.5).
    # Pin to a runner image that carries it; `macos-latest` will follow Xcode
    # upgrades and may not match.
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Regenerate the project from project.yml
        run: xcodegen generate

      - name: Fail if the checked-in pbxproj drifted from project.yml
        run: |
          if ! git diff --quiet -- pikicam.xcodeproj/project.pbxproj; then
            echo "::error::project.pbxproj does not match project.yml."
            echo "Edit project.yml and run 'xcodegen generate'; never hand-edit the pbxproj."
            git --no-pager diff --stat -- pikicam.xcodeproj/project.pbxproj
            exit 1
          fi

      - name: Run the design lint
        run: ./scripts/verify-design.sh

      - name: Run the rest of the unit suite
        run: |
          xcodebuild test \
            -project pikicam.xcodeproj \
            -scheme pikicam \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -only-testing:pikicamTests \
            -skip-testing:pikicamTests/DesignLintTests
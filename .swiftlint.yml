disabled_rules:
  - static_over_final_class  # `override class var` is Swift's required spelling for layerClass
  - trailing_comma
  - opening_brace

included:
  - pikicam
  - pikicamTests
  - pikicamDeviceTests
  - pikicamUITests
  - Probes

identifier_name:
  min_length: 1
  max_length: 60
  excluded:
    - x
    - y
    - r
    - g
    - b
    - e
    - a
    - c
    - f
    - id
    - by
    - ok

line_length:
  warning: 120
  error: 200
  ignores_comments: true

type_name:
  min_length: 2
  max_length: 60

function_body_length:
  warning: 40
  error: 60

file_length:
  warning: 300
  error: 400


nesting:
  type_level:
    warning: 3
  function_level:
    warning: 4

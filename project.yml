# pikicam — XcodeGen project definition
#
# This file is the SOURCE OF TRUTH for the Xcode project. pikicam.xcodeproj is
# generated, not hand-maintained:
#
#   xcodegen generate        # overwrites pikicam.xcodeproj deterministically
#
# Do not edit project.pbxproj by hand — edit this file and regenerate.

name: pikicam
options:
  bundleIdPrefix: piki
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.5"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_TEAM: V7BF8622ZR
    CODE_SIGN_STYLE: Automatic

targets:
  pikicam:
    type: application
    platform: iOS
    sources:
      - path: pikicam
    settings:
      base:
        # TEMPORARY (DECISIONS D7): Xcode account session is dead pending owner
        # re-auth; piki.pikicamProbes has a cached profile so tests can run.
        # Revert to piki.pikicam once the owner signs back into Xcode.
        PRODUCT_BUNDLE_IDENTIFIER: piki.pikicamProbes
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: pikicam needs camera access to capture DNG raw photos with zero computational processing.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: pikicam accesses your photo library to show and manage the DNG photos you capture.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: pikicam saves the DNG photos you capture to your photo library.
        INFOPLIST_KEY_UIAppFonts: "SpaceMono-Regular.ttf SpaceMono-Bold.ttf"
        MTL_COMPILER_FLAGS: -fcikernel
        MTLLINKER_FLAGS: -cikernel

  pikicamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: pikicamTests
    resources:
      - path: pikicamTests/Fixtures
    dependencies:
      - target: pikicam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: piki.pikicamTests

  pikicamUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: pikicamUITests
    dependencies:
      - target: pikicam
    settings:
      base:
        # TEMPORARY (DECISIONS D7): shared cached profile until owner re-auth.
        PRODUCT_BUNDLE_IDENTIFIER: piki.pikicamProbesUITests
        TEST_TARGET_NAME: pikicam

  pikicamDeviceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: pikicamDeviceTests
    dependencies:
      - target: pikicam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: piki.pikicamDeviceTests

  pikicamProbes:
    type: application
    platform: iOS
    sources:
      - path: Probes/pikicamProbes
      - path: Probes/pikicamProbes/Fixtures/IMG_1361.DNG
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: piki.pikicamProbes
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
        GCC_TREAT_WARNINGS_AS_ERRORS: NO
        SWIFT_OBJC_BRIDGING_HEADER: Probes/pikicamProbes/ProbesBridgingHeader.h
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Probe app captures Bayer RAW photos on the connected device to verify capture claims.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Probe app verifies PhotoKit resource shapes by creating and deleting its own assets.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Probe app saves its own probe assets to verify PhotoKit behaviour.

  pikicamProbesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Probes/pikicamProbesUITests
    dependencies:
      - target: pikicamProbes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: piki.pikicamProbesUITests
        TEST_TARGET_NAME: pikicamProbes

schemes:
  pikicam:
    build:
      targets:
        pikicam: all
        pikicamTests: [test]
        pikicamUITests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - pikicamTests
        - pikicamUITests

  pikicam-device:
    build:
      targets:
        pikicam: all
        pikicamDeviceTests: [test]
    test:
      config: Debug
      targets:
        - pikicamDeviceTests

  pikicamProbes:
    build:
      targets:
        pikicamProbes: all
    test:
      config: Debug
      targets:
        - pikicamProbesUITests

# pikicam — XcodeGen project definition
#
# This file is the SOURCE OF TRUTH for the Xcode project. pikicam.xcodeproj is
# generated, not hand-maintained:
#
#   xcodegen generate        # overwrites pikicam.xcodeproj deterministically
#
# Do not edit project.pbxproj by hand — edit this file and regenerate. The
# directory-based `sources` below mean every .swift file under pikicam/ and
# pikicamTests/ is compiled automatically; there is no file list to forget.
#
# History: between 2026-08 and 2026-10 the checked-in pbxproj was hand-edited
# while this file lagged, which silently orphaned pikicam/Core/Design/*.swift
# and pikicamTests/DesignLintTests.swift — they were in no target and never
# compiled, so the design lint reported success having run zero tests. The
# settings below were ported back from that pbxproj so regenerating loses
# nothing. Keep them in sync by regenerating, never by hand-editing.

name: pikicam
options:
  bundleIdPrefix: piki
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.5"

settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    # Device signing (v2 §2): the iPhone 12 mini is the verification target.
    DEVELOPMENT_TEAM: GV4GK5XGN5
    CODE_SIGN_STYLE: Automatic

targets:
  pikicam:
    type: application
    platform: iOS
    sources:
      - path: pikicam
        excludes:
          - "Resources/Info.plist"   # redundant: GENERATE_INFOPLIST_FILE=YES
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: piki.pikicam
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        # iPhone only (owner ruling 2026-10-02: iPad out of scope).
        TARGETED_DEVICE_FAMILY: "1"
        # Both orientations on iPhone (owner ruling 2026-10-02). The camera
        # layout must be designed for landscape, not just tolerated.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: pikicam needs camera access to capture DNG raw photos with zero computational processing.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: pikicam accesses your photo library to show and manage the DNG photos you capture.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: pikicam saves the DNG photos you capture to your photo library.
    scheme:
      testTargets:
        - pikicamTests

  pikicamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: pikicamTests
    resources:
      - path: pikicamTests/Fixtures
    dependencies:
      - target: pikicam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: piki.pikicamTests

  pikicamUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: pikicamUITests
    dependencies:
      - target: pikicam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: piki.pikicamUITests
        TEST_TARGET_NAME: pikicam

  # ------------------------------------------------------------------
  # v2 §14 — probe target (Phase 0). Committed probe files, never links
  # app sources, excluded from the main test action. Runs the §1
  # claims-under-test ledger on the connected iPhone 12 mini.
  # ------------------------------------------------------------------
  pikicamProbes:
    type: application
    platform: iOS
    sources:
      - path: Probes/pikicamProbes
      - path: Probes/pikicamProbes/Fixtures/IMG_1361.DNG
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: piki.pikicamProbes
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_OBJC_BRIDGING_HEADER: Probes/pikicamProbes/ProbesBridgingHeader.h
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Probe app captures Bayer RAW photos on the connected device to verify capture claims.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Probe app verifies PhotoKit resource shapes by creating and deleting its own assets.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Probe app saves its own probe assets to verify PhotoKit behaviour.

  pikicamProbesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Probes/pikicamProbesUITests
    dependencies:
      - target: pikicamProbes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: piki.pikicamProbesUITests
        TEST_TARGET_NAME: pikicamProbes

schemes:
  pikicam:
    build:
      targets:
        pikicam: all
        pikicamTests: [test]
        pikicamUITests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - pikicamTests
        - pikicamUITests

  pikicamProbes:
    build:
      targets:
        pikicamProbes: all
    test:
      config: Debug
      targets:
        - pikicamProbesUITests
